[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "histra-job-builder"
version = "1.1.0"
description = "Deterministic HiStrA HRX compiler, importer, previewer and scenario-variant toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Maurício Bonatte"}]
dependencies = [
  "lxml>=5.2",
  "pydantic>=2.7",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
dev = ["mypy>=1.10", "ruff>=0.6"]

[project.scripts]
histra-builder = "histra_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["histra_builder"]
omit = ["src/histra_builder/cli.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
