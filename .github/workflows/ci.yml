name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # histra-python (parity/integration tests) requires Python 3.12+.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Install histra-python solver integration dependency
        if: ${{ matrix.python != '3.11' }}
        run: python -m pip install "histra-python @ git+https://github.com/mbonatte/histra-python.git@v1.2.2"
      - name: Full suite with coverage
        if: ${{ matrix.python != '3.11' }}
        run: pytest --cov=histra_builder --cov-report=term-missing
      - name: Core suite (histra-python requires Python 3.12+)
        if: ${{ matrix.python == '3.11' }}
        run: pytest -q
      - run: python -m compileall -q src
